<style>
:root{
 --bg:#000; --s1:#0a0a0a; --s2:#121212; --s3:#1b1b1b; --line:#242424; --line2:#353535;
 --tx:#f4f3ef; --mut:#8e8e96; --dim:#5b5b63;
 --gold:#f4c042; --gold2:#d99e1e; --gold-soft:rgba(244,192,66,.11); --gold-line:rgba(244,192,66,.38);
 --red:#e5484d;
 --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',Impact,sans-serif;
 --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --tab:66px;
 box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);
 padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#000;color:var(--tx);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{flex:none;display:block}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
@media(min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.scr{padding:18px 18px calc(var(--tab) + 34px + env(safe-area-inset-bottom,0px))}
.disp{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.mut{color:var(--mut)} .gold{color:var(--gold)} .sm{font-size:13.5px} .xs{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px} .sp{justify-content:space-between}
.sec{margin-top:30px}
.sec>h3{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:12px}
.hint{color:var(--mut);font-size:13.5px}

/* splash */
#splash{position:fixed;inset:0;z-index:300;background:#000;display:flex;align-items:center;justify-content:center;animation:splOut .5s ease 1.15s forwards}
#splash img{width:min(64vw,300px);height:auto;animation:splIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes splIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes splOut{to{opacity:0;visibility:hidden}}

/* top */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello h1{font-family:var(--display);font-weight:800;font-size:38px;line-height:1}
.hello p{color:var(--mut);margin-top:4px;font-size:14px}
.pills{display:flex;gap:8px;padding-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:99px;font-weight:600;font-size:14.5px;white-space:nowrap}
.pill.g{color:var(--gold);border-color:var(--gold-line);background:var(--gold-soft)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:20px 0 16px}
.day{position:relative;border:1px solid var(--line);background:transparent;border-radius:12px;padding:8px 0 10px;text-align:center;font-size:12px;color:var(--mut)}
.day b{display:block;font-family:var(--display);font-size:19px;font-weight:700;color:var(--tx);line-height:1.15}
.day i{display:block;width:5px;height:5px;border-radius:50%;margin:5px auto 0;background:transparent}
.day.train i{background:var(--dim)} .day.done i{background:var(--gold)}
.day.rest b{color:var(--dim)}
.day.sel{border-color:var(--gold);background:var(--gold-soft)}
.day.today b{color:var(--gold)}

/* quest hero */
.quest{position:relative;border-radius:22px;padding:22px 20px 20px;background:radial-gradient(110% 80% at 105% -10%,rgba(244,192,66,.2),transparent 58%),var(--s1);border:1px solid var(--gold-line);overflow:hidden}
.quest .arc{position:absolute;right:-36px;top:-44px;width:190px;height:190px;pointer-events:none;opacity:.55}
.quest .lab{display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:600;font-size:14px}
.quest h2{font-family:var(--display);font-weight:900;font-size:50px;line-height:.92;text-transform:uppercase;margin:10px 0 6px;position:relative}
.quest .sub{color:var(--mut);position:relative}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:16px 0 14px;font-weight:600}
.meta span{display:flex;align-items:center;gap:6px}
.meta svg{color:var(--gold)}
.mlist{list-style:none;margin:0 0 16px;padding:0;border-top:1px solid var(--line)}
.mlist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.mlist li span:last-child{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;border-radius:12px;background:var(--s3);margin-bottom:14px}
.seg button{border:0;background:transparent;height:38px;border-radius:9px;color:var(--mut);font-weight:600;font-size:14px}
.seg button.on{background:#000;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border:0;border-radius:14px;font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:.05em;text-transform:uppercase}
.btn.gold{background:linear-gradient(180deg,#f9d062,#e5a82a);color:#000;box-shadow:0 0 0 1px rgba(244,192,66,.7),0 12px 32px -12px rgba(244,192,66,.6)}
.btn.gold:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--tx)}
.btn.red{background:transparent;border:1px solid rgba(229,72,77,.5);color:var(--red)}
.btn.s{height:44px;font-size:17px;border-radius:11px;letter-spacing:.04em}
.btn[disabled]{opacity:.35;pointer-events:none}
.linkbtn{background:none;border:0;color:var(--gold);font-weight:600;padding:8px 0}

/* level */
.lvlrow{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.lvlrow b{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase}
.lvlrow span{color:var(--mut);font-size:14px}
.bar{position:relative;height:12px;border-radius:3px;background:var(--s3);overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:3px 0 0 3px}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#000 calc(10% - 2px) 10%)}
.bar.thin{height:6px}.bar.thin::after{display:none}.bar.thin>i{border-radius:3px}
.next{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--mut);font-size:13.5px}
.next svg{color:var(--gold)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.stat{padding:16px 4px 14px;border-bottom:1px solid var(--line)}
.stat:nth-child(odd){padding-right:16px;border-right:1px solid var(--line)}
.stat:nth-child(even){padding-left:18px}
.stat .n{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px;margin-bottom:6px}
.stat .n svg{color:var(--gold)}
.stat b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.stat .bar{margin-top:10px}

/* generic list rows */
.list{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.chk{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:#000}
.chk.on{background:var(--gold);border-color:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--gold);font-weight:600}

/* rest day */
.restcard{border-radius:22px;border:1px solid var(--line2);background:var(--s1);padding:22px 20px}
.restcard h2{font-family:var(--display);font-weight:900;font-size:46px;line-height:.95;text-transform:uppercase;margin:10px 0 8px}

/* duel banner */
.duel{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:14px;padding:14px}
.duel svg{color:var(--gold)}

/* tabbar */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(0,0,0,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom,0px)}
.tabbar button{position:relative;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;color:var(--dim);font-size:11.5px;font-weight:600}
.tabbar button.on{color:var(--gold)}
.tabbar button.on::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--gold);border-radius:0 0 2px 2px}

/* session */
.sess{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;background:#000;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 150px}
.sess-h{position:sticky;top:calc(-1 * env(safe-area-inset-top,0px) - 12px);z-index:2;margin:-12px -18px 8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 14px;background:linear-gradient(#000 82%,transparent)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:transparent;display:grid;place-items:center}
.sess-h h2{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1}
.mis{padding:18px 0 20px;border-bottom:1px solid var(--line)}
.mis.done .nm{color:var(--mut)}
.mis .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.mis .nm{font-weight:600;font-size:18px;line-height:1.2}
.mis .tg{color:var(--mut);font-size:13px;margin-top:2px}
.mis .tt{font-family:var(--display);font-weight:800;font-size:26px;color:var(--gold);white-space:nowrap;line-height:1}
.sets{display:flex;flex-wrap:wrap;gap:10px}
.set{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;color:var(--mut);font-family:var(--display);font-weight:700;font-size:21px;display:grid;place-items:center;transition:transform .12s,background .12s}
.set.on{background:var(--gold);border-color:var(--gold);color:#000}
.set:active{transform:scale(.92)}
.inps{display:flex;gap:10px;margin-top:14px}
.fld{flex:1;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mut)}
.fld input{height:44px;background:var(--s2);border:1px solid var(--line2);border-radius:10px;color:var(--tx);font:600 17px var(--body);padding:0 12px;width:100%}
.fld input:focus{border-color:var(--gold);outline:0}
.sugg{margin-top:8px;font-size:13px;color:var(--gold)}
.sess-f{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:41;padding:26px 18px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000 38%)}
.rest{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:10px 14px;border:1px solid var(--gold-line);border-radius:14px;background:#0b0904;width:100%;text-align:left}
.rest b{font-family:var(--display);font-size:30px;font-weight:800;color:var(--gold);min-width:64px}
.rest .bar{flex:1}
.xpfloat{position:fixed;z-index:400;pointer-events:none;font-family:var(--display);font-weight:800;font-size:26px;color:var(--gold);animation:flt .9s ease-out forwards}
@keyframes flt{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-56px)}}

/* overlays */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.96);display:flex;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 22px calc(env(safe-area-inset-bottom,0px) + 24px)}
.ov .in{width:100%;max-width:420px;margin:auto;text-align:center}
.ov h1{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.9}
.ov .big{font-size:60px;color:var(--gold)}
.rew{display:flex;flex-direction:column;margin:26px 0;border-top:1px solid var(--line)}
.rew>div{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);font-size:17px}
.rew b{font-family:var(--display);font-size:30px;font-weight:800;color:var(--gold)}
.rew .l{display:flex;align-items:center;gap:10px;color:var(--mut)}
.rew .l svg{color:var(--gold)}
.up{position:relative;width:230px;height:230px;margin:6px auto 10px}
.up svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.up svg.ring circle{stroke-dasharray:597;stroke-dashoffset:597;animation:draw 1.1s cubic-bezier(.3,.7,.2,1) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.up .crown{position:absolute;left:50%;top:-6px;transform:translateX(-50%);color:var(--gold);animation:drop .7s cubic-bezier(.3,1.4,.4,1) .9s both}
@keyframes drop{from{opacity:0;transform:translate(-50%,-34px)}to{opacity:1;transform:translate(-50%,0)}}
.up .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:110px;line-height:1;animation:pop .6s cubic-bezier(.3,1.5,.4,1) .55s both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.glow{animation:glow 1.6s ease-out .6s both}
@keyframes glow{from{text-shadow:0 0 0 rgba(244,192,66,0)}40%{text-shadow:0 0 34px rgba(244,192,66,.75)}to{text-shadow:0 0 12px rgba(244,192,66,.25)}}
.unl{margin:22px 0;text-align:left;border-top:1px solid var(--line)}
.unl div{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.unl svg{color:var(--gold)}

/* sheet + toast */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;z-index:61;background:var(--s1);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88dvh;max-height:88vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.sheet h3{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;background:#141104;border:1px solid var(--gold-line);color:var(--tx);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14.5px;max-width:92vw;text-align:center;animation:toast 2.8s ease forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* onboarding */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.obp{display:flex;gap:5px;margin-bottom:8px}
.obp i{flex:1;height:3px;border-radius:2px;background:var(--line2)} .obp i.on{background:var(--gold)}
.ob h2{font-family:var(--display);font-weight:800;font-size:44px;line-height:.95;text-transform:uppercase;margin:26px 0 8px}
.ob .lead{color:var(--mut);margin-bottom:24px}
.ob .body{flex:1}
.ob .foot{padding-top:20px;display:grid;gap:10px}
.lbl{font-size:14px;color:var(--mut);margin:18px 0 8px;display:block}
.inp{width:100%;height:56px;background:var(--s2);border:1px solid var(--line2);border-radius:12px;color:var(--tx);font:500 19px var(--body);padding:0 16px}
.inp:focus{outline:0;border-color:var(--gold)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;height:44px;min-width:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line2);background:transparent;font-weight:600;font-size:15px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#000}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:17px 18px;border-radius:14px;border:1px solid var(--line);background:var(--s1);margin-bottom:10px}
.opt b{display:block;font-size:18px;font-weight:600}
.opt span{color:var(--mut);font-size:14px}
.opt.on{border-color:var(--gold);background:var(--gold-soft)}
.opt .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;color:#000}
.opt.on .radio{background:var(--gold);border-color:var(--gold)}
.err{color:var(--red);font-size:14px;margin-top:14px}
.welcome{align-items:center;text-align:center;justify-content:center;gap:0}
.welcome img{width:min(78vw,330px);height:auto;margin:0 auto}
.welcome h1{font-family:var(--display);font-weight:800;font-size:38px;text-transform:uppercase;line-height:1;margin:6px 0 8px}
.plan .li b{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.gen{display:grid;place-items:center;text-align:center;flex:1;gap:16px}
.spin{width:64px;height:64px;border-radius:50%;border:4px solid var(--line2);border-top-color:var(--gold);animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* progress */
.tiles{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.tile{padding:16px 4px;border-bottom:1px solid var(--line)}
.tile:nth-child(odd){border-right:1px solid var(--line);padding-right:16px}.tile:nth-child(even){padding-left:18px}
.tile b{display:block;font-family:var(--display);font-size:38px;font-weight:800;line-height:1}
.tile span{color:var(--mut);font-size:14px}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:6px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.col i{display:block;width:100%;min-height:3px;background:var(--gold-line);border-radius:4px 4px 0 0}
.col.cur i{background:linear-gradient(180deg,var(--gold),var(--gold2))}
.col small{font-size:11.5px;color:var(--mut)} .col em{font-style:normal;font-size:11.5px;color:var(--tx);font-weight:600}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.bdg{padding:16px 8px 14px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.bdg .h{width:52px;height:52px;margin:0 auto 8px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--gold);color:#000}
.bdg.off .h{background:var(--s3);color:var(--dim)}
.bdg b{display:block;font-size:13px;line-height:1.2;font-weight:600}
.bdg.off b{color:var(--mut)}
.bdg small{display:block;color:var(--dim);font-size:11px;margin-top:2px;line-height:1.25}

/* boss */
.boss{position:relative;padding:20px 0 22px;border-bottom:1px solid var(--line)}
.boss .hx{width:60px;height:66px;flex:none;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:rgba(229,72,77,.16);color:var(--red)}
.boss h3{font-family:var(--display);font-weight:800;font-size:32px;text-transform:uppercase;line-height:1}
.boss.lock{opacity:.55}
.task{padding:10px 0}
.task .top2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.task .v{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px}
.step{display:flex;gap:6px}
.step button{height:34px;min-width:52px;padding:0 10px;border-radius:9px;border:1px solid var(--line2);background:transparent;font-weight:600;font-size:14px}
.rewline{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;color:var(--gold);font-weight:600;font-size:14.5px}
.rewline span{display:flex;align-items:center;gap:6px}
.vict{color:var(--gold);display:flex;align-items:center;gap:8px;font-weight:600}

/* friends */
.code{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--gold-line);background:var(--gold-soft);border-radius:16px;padding:14px 16px}
.code b{font-family:var(--display);font-size:32px;letter-spacing:.08em;font-weight:800}
.qr{margin:14px auto 0;width:170px;background:#fff;padding:10px;border-radius:12px}
.qr svg{display:block;width:100%;height:auto}
.addf{display:flex;gap:8px}
.addf .inp{height:48px;font-size:17px}
.addf .btn{width:auto;padding:0 18px;height:48px;font-size:17px}
.ch{padding:16px 0;border-bottom:1px solid var(--line)}
.ch h4{margin:0;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.lane{display:grid;grid-template-columns:96px 1fr 54px;align-items:center;gap:10px;margin-top:10px;font-size:14px}
.lane .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.lane.me .nm{color:var(--gold);font-weight:600}
.lane.me .bar>i{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.lane:not(.me) .bar>i{background:var(--line2)}
.lb{display:grid;grid-template-columns:32px 40px 1fr auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.lb .rk{font-family:var(--display);font-weight:800;font-size:24px;color:var(--mut);text-align:center}
.lb.me .rk,.lb.me .pv{color:var(--gold)}
.lb .av{width:40px;height:40px;border-radius:50%;background:var(--s3);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.lb.me .av{border-color:var(--gold);color:var(--gold)}
.lb .pv{font-family:var(--display);font-weight:800;font-size:26px}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:22px;padding:12px 14px;border:1px dashed var(--line2);border-radius:12px;color:var(--mut);font-size:13px}

/* hero */
.stage{position:relative;height:330px;display:grid;place-items:center;border-radius:22px;border:1px solid var(--line);background:radial-gradient(70% 60% at 50% 40%,rgba(244,192,66,.14),transparent 70%),var(--s1);overflow:hidden}
.stage .avatar{height:300px;width:auto}
.stage .lv{position:absolute;left:14px;top:12px}
.stage .lv b{font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;line-height:1;display:block}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.item{text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:14px;padding:13px 14px;min-height:78px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.item b{font-weight:600;font-size:15px;line-height:1.2}
.item small{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:5px}
.item.eq{border-color:var(--gold);background:var(--gold-soft)}
.item.eq small{color:var(--gold)}
.item.lk{opacity:.5}
.swatches{display:flex;gap:12px;margin-top:8px}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid var(--line2)} .sw.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,192,66,.25)}
.zones .li .zt{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase}
.zones .li.cur .zt{color:var(--gold)}
.zones .li.lk{opacity:.5}
.tgl{width:50px;height:30px;border-radius:99px;background:var(--s3);border:1px solid var(--line2);position:relative;flex:none}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:all .18s}

function splitFor(n,prof){
 const T=TPL;
 if(n===1)return[T.FULLA];
 if(n===2)return[T.FULLA,T.FULLB];
 if(n===3)return prof.level==='avance'&&prof.goal==='muscle'?[T.PUSH,T.PULL,T.LEGS]:[T.FULLA,T.FULLB,T.FULLC];
 if(n===4)return[T.UPPER,T.LOWER,T.UPPER,T.LOWER];
 if(n===5)return[T.CHEST,T.BACK,T.LEGS,T.SHOULD,T.CORE];
 return[T.PUSH,T.PULL,T.LEGS,T.PUSH,T.PULL,T.LEGS];
}

const addD=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmtD(d)};
const wkKey=s=>addD(s,-wdOf(s));
const diffD=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const shortD=s=>parseD(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtN=n=>Math.round(n).toLocaleString('fr-FR');
function hash(s){let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* niveaux */
const xpFor=l=>200+50*l;
function lvlInfo(t){let l=1,r=t;while(r>=xpFor(l)){r-=xpFor(l);l++}return{l,cur:r,need:xpFor(l),pct:r/xpFor(l)}}
const cumXP=l=>{let s=0;for(let i=1;i<l;i++)s+=xpFor(i);return s};
const titleOf=l=>TITLES.filter(t=>t[0]<=l).pop()[1];
const zoneOf=l=>ZONES.filter(z=>z[0]<=l).pop()[1];
const statLvl=x=>Math.floor(Math.sqrt(x/60))+1;
const statPct=x=>{const l=statLvl(x),a=(l-1)*(l-1)*60,b=l*l*60;return(x-a)/(b-a)};

/* ============ PROGRAMME ============ */
const weekIdx=()=>S.profile?Math.max(0,Math.floor(diffD(today(),S.profile.start)/7)):0;
function availEx(g,p){
 return EX.filter(e=>e.g===g&&(p.place==='home'?(e.loc!=='g'&&e.eq.every(q=>p.equip.includes(q))):e.loc!=='h'));
}
function pickEx(g,used,rot,tier,p,oc){
 const c=availEx(g,p).filter(e=>!e.v&&!used.has(e.id)).sort((a,b)=>b.c-a.c);
 if(!c.length)return null;
 let ex=c[oc===0?0:(oc+rot)%c.length];
 for(let i=0;i<tier&&ex.h;i++){const hv=EXB[ex.h];if(hv&&availEx(g,p).some(e=>e.id===hv.id)){ex=hv}else break}
 return ex;
}
function params(ex,p,prog){
 let goal=p.goal;if(goal==='force'&&p.age<16)goal='forme';
 const G=GOALS[goal],sub=prog%6;
 let sets=G.s,lo=G.r[0],hi=G.r[1],rest=G.rest;
 if(!ex.c){if(goal==='force'){sets=3;lo=8;hi=10;rest=75}else rest=Math.max(30,rest-15)}
 else if(goal==='force')sets=p.level==='avance'?5:4;
 if(p.level==='debutant')sets=Math.min(sets,3);
 else if(p.level==='avance'&&ex.c&&goal!=='force')sets=Math.min(sets+1,5);
 if(p.age>=45){lo+=2;hi+=2;rest+=15}
 if(p.age>=60)sets=Math.max(2,sets-1);
 const reps=Math.min(hi,lo+sub);
 if(sub>hi-lo&&sets<5)sets++;
 if(ex.t==='t'){const base=(goal==='endurance'||goal==='perte')?40:30;return{type:'t',sets:Math.min(sets,4),secs:clamp(base+sub*5,20,90),rest:Math.max(30,rest-15)}}
 if(ex.t==='m'){return{type:'m',sets:1,mins:8+sub*2+((goal==='endurance'||goal==='perte')?4:0),rest:0}}
 return{type:'r',sets,reps,rest};
}
const mTime=m=>m.type==='m'?m.mins:m.type==='t'?m.sets*(m.secs+m.rest)/60:m.sets*(40+m.rest)/60+.5;
const setXP=m=>m.type==='m'?30:m.warm?10:12;
function buildQuest(tpl,p,prog,rot,wd){
 const tier=Math.floor(prog/6),slots=[...tpl.s];
 if((p.goal==='perte'||p.goal==='endurance')&&!slots.includes('cardio'))slots.splice(3,0,'cardio');
 const budget=p.duration-5,used=new Set(),cnt={},ms=[];let total=0;
 for(const g of slots){
  const oc=cnt[g]||0;cnt[g]=oc+1;
  const ex=pickEx(g,used,rot,tier,p,oc);if(!ex)continue;
  const par=params(ex,p,prog),m=Object.assign({exId:ex.id,name:ex.n,g:ex.g,load:isLoad(ex)},par),t=mTime(m);
  if(ms.length>=3&&total+t>budget+2)continue;
  used.add(ex.id);ms.push(m);total+=t;if(ms.length>=9)break;
 }
 ms.unshift({exId:'warm',name:'Échauffement',g:'cardio',type:'t',sets:1,secs:300,rest:0,warm:true,load:false});
 ms.forEach((m,i)=>m.id='m'+i);
 const q={id:'d'+wd,wd,k:tpl.k,title:tpl.t,focus:tpl.f,missions:ms};
 return finishQ(q,60);
}
function finishQ(q,bonus){
 q.bonus=bonus;
 q.minutes=Math.round(q.missions.reduce((a,m)=>a+(m.warm?5:mTime(m)),0));
 q.xp=q.missions.reduce((a,m)=>a+m.sets*setXP(m),0)+bonus;
 return q;
}
let _pk='',_pv=null;
function PROG(){
 const p=S.profile;if(!p)return null;
 const k=JSON.stringify([p,S.prog,weekIdx()]);
 if(k!==_pk){
  const avail=[0,1,2,3,4,5,6].filter(d=>!p.rest.includes(d));
  const n=Math.max(1,Math.min(p.days,avail.length||1,6));
  const list=avail.length?avail:[0,1,2,3,4,5,6];
  const train=[];for(let i=0;i<n;i++)train.push(list[Math.floor((i+.5)*list.length/n)]);
  const tpls=splitFor(n,p),occ={},days={};
  train.forEach((wd,i)=>{const t=tpls[i],o=occ[t.k]||0;occ[t.k]=o+1;days[wd]=buildQuest(t,p,S.prog,weekIdx()+o,wd)});
  _pv={days,train,n};_pk=k;
 }
 return _pv;
}
function applyMode(q,mode){
 const c=JSON.parse(JSON.stringify(q));c.mode=mode;
 const warm=c.missions[0];let rest=c.missions.slice(1);
 if(mode==='short'){rest=rest.slice(0,Math.max(3,Math.ceil(rest.length*.6)));rest.forEach(m=>{if(m.type!=='m')m.sets=Math.min(m.sets,3)})}
 if(mode==='light'){rest.forEach(m=>{if(m.type==='m')m.mins=Math.max(5,m.mins-3);else m.sets=Math.max(2,m.sets-1)})}
 c.missions=[warm,...rest];
 return finishQ(c,mode==='full'?60:40);
}
function prevSched(from){
 const P=PROG();if(!P)return null;
 for(let i=1;i<=7;i++){const d=addD(from,-i);if(P.train.includes(wdOf(d)))return d}
 return null;
}
function curStreak(){
 const st=S.streak;if(!st.count)return 0;
 if(st.last===today())return st.count;
 const ps=prevSched(today());
 return(!ps||st.last>=ps)?st.count:0;
}
const doneOn=d=>S.log.filter(l=>l.d===d);
const weekLog=()=>{const w=wkKey(today());return S.log.filter(l=>wkKey(l.d)===w)};

function toast(msg){
 const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);

function award(xp,coins,statKey,statXP){
 const before=lvlInfo(S.xp).l;
 S.xp+=xp;S.coins+=coins;
 if(statKey)S.stats[statKey]=(S.stats[statKey]||0)+statXP;
 const after=lvlInfo(S.xp).l;
 if(after>before)Q.push({type:'level',from:before,to:after});
}

}
function unlocksBetween(a,b){
 const out=[];
 for(const k in CAT)CAT[k].items.forEach(i=>{if(i.lvl>a&&i.lvl<=b)out.push({i:'gift',t:CAT[k].n+' : '+i.n})});
 ZONES.forEach(z=>{if(z[0]>a&&z[0]<=b)out.push({i:'map',t:'Nouvelle zone : '+z[1]})});
 BOSSES.forEach(o=>{if(o.lvl>a&&o.lvl<=b)out.push({i:'skull',t:'Nouveau boss : '+o.n})});
 TITLES.forEach(t=>{if(t[0]>a&&t[0]<=b)out.push({i:'crown',t:'Nouveau titre : '+t[1]})});
 return out;
}
function nextUnlock(){
 const l=lvlInfo(S.xp).l,c=[];
 for(const k in CAT)CAT[k].items.forEach(i=>{if(i.lvl>l)c.push({lvl:i.lvl,t:i.n})});
 BOSSES.forEach(o=>{if(o.lvl>l)c.push({lvl:o.lvl,t:o.n+' (boss)'})});
 ZONES.forEach(z=>{if(z[0]>l)c.push({lvl:z[0],t:z[1]+' (zone)'})});
 TITLES.forEach(t=>{if(t[0]>l)c.push({lvl:t[0],t:'Titre '+t[1]})});
 c.sort((a,b)=>a.lvl-b.lvl);return c[0]||null;
}
function runOf(q){
 const done={},inp={};q.missions.forEach(m=>{done[m.id]=Array(m.sets).fill(false);inp[m.id]={w:'',r:''}});
 return{date:today(),quest:q,done,inp,t0:Date.now()};
}
function runStats(run){
 let sets=0,dn=0,xp=0;
 run.quest.missions.forEach(m=>{sets+=m.sets;const n=(run.done[m.id]||[]).filter(Boolean).length;dn+=n;xp+=n*setXP(m)});
 return{sets,done:dn,xp,ratio:sets?dn/sets:0};
}
function finishRun(){
 const run=S.run;if(!run)return;
 const rs=runStats(run),q=run.quest,full=rs.ratio>=.8,t=today();
 /* série */
 let newStreak=S.streak.count;
 if(S.streak.last!==t){
  const ps=prevSched(t);
  newStreak=(!S.streak.count||!ps||S.streak.last>=ps)?S.streak.count+1:1;
  S.streak.count=newStreak;S.streak.best=Math.max(S.streak.best,newStreak);S.streak.last=t;
 }
 const xp=rs.xp+(full?q.bonus:0),coins=full?50+2*Math.min(newStreak,15):10;
 /* exercices, records */
 const exs=[],recs=[];let pompes=0,gain=0;const stX={};
 q.missions.forEach(m=>{
  const n=(run.done[m.id]||[]).filter(Boolean).length;if(!n)return;
  const g=GSTAT[m.g]||'endurance';stX[g]=(stX[g]||0)+n*setXP(m);
  if(m.warm)return;
  const inp=run.inp[m.id]||{},w=parseFloat(String(inp.w).replace(',','.'))||0,r=parseInt(inp.r)||0;
  exs.push({id:m.exId,n:m.name,sets:n,w:w||null,r:r||m.reps||null});
  let val=0,u='';
  if(m.type==='r'){if(m.load&&w>0){val=w;u='kg'}else if(!m.load){val=r||m.reps;u='reps'}}
  else if(m.type==='t'){val=m.secs;u='s'}
  if(val>0){const old=S.records[m.exId];if(!old||val>old.v){if(old){S.recordsBroken++;recs.push({n:m.name,v:val,u})}S.records[m.exId]={v:val,u,d:t}}}
  if(m.load&&w>0&&n===m.sets){S.exStats[m.exId]={last:w,sug:Math.max(w+1,Math.round(w*1.05*2)/2)}}
  if(m.exId.indexOf('pompes')===0)pompes+=n*((r||m.reps)||0);
  if(m.exId==='gainage'||m.exId==='gain_lat')gain+=n*m.secs;
 });
 S.log.push({d:t,id:q.id,t:q.title,xp,coins,min:q.minutes,mode:q.mode||'full',sets:rs.done,tot:rs.sets,ex:exs,st:{pompes,gain}});
 /* évolution du programme */
 let evolved=false;const wk=wkKey(t),P=PROG();
 if(P&&!S.progWeeks[wk]){
  const ids=new Set(weekLog().filter(l=>l.sets/Math.max(1,l.tot)>=.8).map(l=>l.id));
  if(ids.size>=P.n){S.progWeeks[wk]=true;S.prog++;evolved=true}
 }
 const ov={type:'quest',title:q.title,xp,coins,streak:newStreak,recs,full,partial:!full,evolved,badges:[]};
 Q.push(ov);
 let bx=0;for(const k in stX){bx+=stX[k]}
 const before=lvlInfo(S.xp).l;
 S.xp+=xp;S.coins+=coins;for(const k in stX)S.stats[k]=(S.stats[k]||0)+stX[k];
 const after=lvlInfo(S.xp).l;if(after>before)Q.push({type:'level',from:before,to:after});
 ov.badges=checkBadges();
 S.run=null;V.inRun=false;V.rest=null;save();
 render();pump();
}

/* boss */
function ensureBoss(){
 const wk=wkKey(today());
 if(S.boss.week!==wk){S.boss={week:wk,prog:{},tg:{},done:{}}}
 const li=lvlInfo(S.xp).l,mul={debutant:.8,intermediaire:1,avance:1.25}[S.profile.level]||1;
 const sc=clamp((.4+.06*li)*mul,.4,2.5);
 BOSSES.forEach(b=>b.tasks.forEach(t=>{const key=b.id+'.'+t.k;if(!S.boss.tg[key])S.boss.tg[key]=Math.max(t.step,Math.round(t.base*sc/t.step)*t.step)}));
}
function bossAdd(bid,tk,d){
 ensureBoss();const key=bid+'.'+tk,b=BOSSES.find(o=>o.id===bid);
 if(S.boss.done[bid])return;
 S.boss.prog[key]=clamp((S.boss.prog[key]||0)+d,0,S.boss.tg[key]);
 if(b.tasks.every(t=>(S.boss.prog[bid+'.'+t.k]||0)>=S.boss.tg[bid+'.'+t.k])){
  S.boss.done[bid]=true;S.bossKills[bid]=(S.bossKills[bid]||0)+1;
  award(b.xp,b.coins,'force',Math.round(b.xp/4));
  const nb=checkBadges();
  toast(b.n+' vaincu · +'+fmtN(b.xp)+' XP');
  if(nb.length)setTimeout(()=>toast('Nouveau badge : '+nb[0].n),3000);
 }
 save();render();pump();
}

function addFriend(raw){

/* ============ RENDER ============ */
function render(){
 const y=window.scrollY,sess=document.querySelector('.sess'),sy=sess?sess.scrollTop:0;
 let h,key;
 if(!S.profile){h=obView();key='ob'+V.ob.step}
 else if(S.run&&V.inRun){h=sessionView();key='run'}
 else{let c='';if(V.tab==='home')c=homeView();if(V.tab==='progress')c=progressView();if(V.tab==='boss')c=bossView();if(V.tab==='friends')c=friendsView();if(V.tab==='hero')c=heroView();h=`<main class="scr">${c}</main>${tabbar()}`;key=V.tab}
 app().innerHTML=h;
 $('#sheet').innerHTML=sheetHTML();
 if(key===V.lastKey){window.scrollTo(0,y);const ns=document.querySelector('.sess');if(ns)ns.scrollTop=sy}else window.scrollTo(0,0);
 V.lastKey=key;
 if(V.tab==='friends'&&V.qr&&!V.inRun)drawQR();
}
function drawQR(){
 const b=$('#qrbox');if(!b)return;
 try{const q=qrcode(0,'M');q.addData('bodyquest:'+myCode());q.make();b.innerHTML=q.createSvgTag(4,0)}
 catch(e){b.innerHTML='<p style="color:#000;text-align:center;font-size:13px">QR indisponible hors ligne. Partage ton code.</p>'}
}
function floatXP(el,txt){
 const r=el.getBoundingClientRect(),f=document.createElement('div');f.className='xpfloat';f.textContent=txt;
 f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top-6)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),950);
}
let restTimer=null;
function startRest(sec){
 if(!sec)return;clearInterval(restTimer);
 const end=Date.now()+sec*1000;V.rest={end,total:sec,left:sec};
 restTimer=setInterval(()=>{
  if(!V.rest){clearInterval(restTimer);return}
  const left=Math.max(0,Math.ceil((V.rest.end-Date.now())/1000));V.rest.left=left;
  const a=$('#rt'),b=$('#rtb');if(a)a.textContent=left+'s';if(b)b.style.width=(100-left/V.rest.total*100)+'%';
  if(left<=0){clearInterval(restTimer);V.rest=null;try{if(navigator.vibrate)navigator.vibrate(180)}catch(e){}if(V.inRun)render()}
 },250);
}

/* ============ ÉVÉNEMENTS ============ */
const A={
 tab(t){V.tab=t.dataset.v;V.err='';render()},
 pv(t){V.pv=+t.dataset.v;render()},
 mode(t){V.mode=t.dataset.v;render()},
 start(){const q=applyMode(PROG().days[V.pv],V.mode);S.run=runOf(q);V.inRun=true;save();render()},
 resume(){V.inRun=true;render()},
 quit(){V.inRun=false;V.rest=null;save();render()},
 set(t){
  const m=t.dataset.m,i=+t.dataset.i,run=S.run,mi=run.quest.missions.find(x=>x.id===m);
  run.done[m][i]=!run.done[m][i];save();
  if(run.done[m][i]){floatXP(t,'+'+setXP(mi)+' XP');if(!mi.warm&&i<mi.sets-1&&mi.rest)startRest(mi.rest);else V.rest=null}
  render();
 },
 restskip(){V.rest=null;clearInterval(restTimer);render()},
 finish(){const rs=runStats(S.run);if(rs.ratio>=.8)finishRun();else{V.sheet={type:'finish',done:rs.done,tot:rs.sets};renderSheet()}},
 finishgo(){V.sheet=null;finishRun()},
 sheetclose(){V.sheet=null;renderSheet()},
 restbonus(){const t=today();if(S.restDone[t])return;S.restDone[t]=true;award(40,10,'endurance',40);save();toast('Mobilité terminée · +40 XP');render();pump()},
 side(t){const id=t.dataset.v;if(S.side.done[id])return;S.side.done[id]=true;award(15,5,null,0);save();floatXP(t,'+15 XP');render();pump()},
 ovnext(){ovNext();render()},
 bossadd(t){bossAdd(t.dataset.b,t.dataset.k,+t.dataset.d)},
 lb(t){V.lb=t.dataset.v;render()},
 qr(){V.qr=!V.qr;render()},
 copycode(){const c=myCode();try{navigator.clipboard.writeText(c).then(()=>toast('Code copié : '+c),()=>toast('Ton code : '+c))}catch(e){toast('Ton code : '+c)}},
 addf(){
  const r=addFriend(V.friendInput);
  if(r.indexOf('ok')===0){V.friendInput='';V.err='';save();toast('Ami ajouté'+(r.length>2?' · badge '+r.slice(3):''))}else V.err=r;
  render();
 },
 chnew(){V.sheet={type:'ch',err:'',d:{type:'xp',name:'',m:'xp',who:S.friends.filter(f=>f.share).map(f=>f.code)}};renderSheet()},
 chtype(t){V.sheet.d.type=t.dataset.v;renderSheet()},
 chmetric(t){V.sheet.d.m=t.dataset.v;renderSheet()},
 chwho(t){const w=V.sheet.d.who,c=t.dataset.v,i=w.indexOf(c);if(i>=0)w.splice(i,1);else w.push(c);renderSheet()},
 chgo(){
  const d=V.sheet.d;let c;
  if(!d.who.length){V.sheet.err='Choisis au moins un ami.';renderSheet();return}
  if(d.type==='custom'){if(!d.name.trim()){V.sheet.err='Donne un nom à ton défi.';renderSheet();return}c={type:'custom',name:d.name.trim(),q:'Qui a le plus de '+METRICS[d.m].toLowerCase()+' cette semaine ?',m:d.m,u:{xp:'XP',sess:'séances',pompes:'pompes',gain:'s'}[d.m]}}
  else{const t=CH_TYPES[d.type];c={type:d.type,name:t.n,q:t.q,m:t.m,u:t.u}}
  S.challenges.push(Object.assign(c,{id:'c'+Date.now(),who:[...d.who],by:'me',wk:wkKey(today())}));
  checkBadges();V.sheet=null;save();render();renderSheet();toast('Défi lancé');
 },
 chdel(t){S.challenges=S.challenges.filter(c=>c.id!==t.dataset.v);save();render()},
 hcat(t){V.hcat=t.dataset.v;render()},
 skin(t){S.hero.skin=+t.dataset.v;save();render()},
 hc(t){S.hero.hc=t.dataset.v;save();render()},
 item(t){
  const k=t.dataset.k,id=t.dataset.v,it=itemOf(k,id),li=lvlInfo(S.xp).l;
  if(li<it.lvl){toast('Débloqué au niveau '+it.lvl);return}
  if(!owns(k,it)){if(S.coins<it.cost){toast('Il te manque '+(it.cost-S.coins)+' pièces');return}S.coins-=it.cost;S.owned[it.id]=true;toast(it.n+' acheté')}
  S.hero[k]=id;save();render();
 },
 share(){S.share=!S.share;save();render()},
 editprofile(){const p=S.profile;V.ob={step:1,d:{name:p.name,age:String(p.age),height:String(p.height),weight:String(p.weight),level:p.level,goal:p.goal,days:p.days,rest:[...p.rest],duration:p.duration,place:p.place,equip:[...p.equip]},edit:true};S.profile=null;S._keep=p;render()},
 resetask(){V.sheet={type:'reset'};renderSheet()},
 resetgo(){try{localStorage.removeItem(KEY)}catch(e){}S=newState();_pk='';V.sheet=null;V.tab='home';V.ob.step=0;V.inRun=false;render();renderSheet()},
 demo(){loadDemo();V.pv=wdOf(today());V.tab='home';render();toast('Aperçu chargé : profil Ethan, niveau 18')},
 obback(){V.err='';if(V.ob.step>1)V.ob.step--;else if(V.ob.edit){S.profile=S._keep;delete S._keep;V.ob.edit=false}else V.ob.step=0;render()},
 obpick(t){const f=t.dataset.f;let v=t.dataset.v;if(['days','duration'].includes(f))v=+v;V.ob.d[f]=v;if(f==='place'&&v==='gym')V.ob.d.equip=[];V.err='';render()},
 obrest(t){const i=+t.dataset.v,r=V.ob.d.rest,k=r.indexOf(i);if(k>=0)r.splice(k,1);else r.push(i);render()},
 obeq(t){const e=V.ob.d.equip,v=t.dataset.v,k=e.indexOf(v);if(k>=0)e.splice(k,1);else e.push(v);render()},
 obnext(){
  const o=V.ob;
  if(o.step===0){o.step=1;render();return}
  const er=obValidate();if(er){V.err=er;render();return}V.err='';
  if(o.step===6){
   o.step=7;o.gen=true;render();
   const pf=profileFromOB(),bk=S.profile;S.profile=pf;_pk='';o.preview=PROG();S.profile=bk;_pk='';
   setTimeout(()=>{o.gen=false;render()},1300);return;
  }
  if(o.step===7){
   const pf=profileFromOB(),keep=S._keep;delete S._keep;
   if(o.edit){S.profile=Object.assign({},keep,pf,{start:keep.start})}else{S=newState();S.profile=pf}
   o.edit=false;_pk='';V.pv=wdOf(today());V.tab='home';save();render();toast('Bienvenue, '+pf.name);return;
  }
  o.step++;render();
 }
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
 const f=A[t.dataset.a];if(f){if(t.classList.contains('sheet-bg')&&e.target!==t)return;f(t,e)}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.o){V.ob.d[t.dataset.o]=t.value}
 else if(t.dataset.in==='w'||t.dataset.in==='r'){S.run.inp[t.dataset.m][t.dataset.in]=t.value;save()}
 else if(t.dataset.in==='friend'){V.friendInput=t.value}
 else if(t.dataset.in==='chname'){V.sheet.d.name=t.value}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.in==='friend'){e.preventDefault();A.addf()}
});
function renderSheet(){$('#sheet').innerHTML=sheetHTML()}

/* ============ DÉMARRAGE ============ */
document.addEventListener('DOMContentLoaded',()=>{
 if(S.run&&S.run.date!==today())S.run=null;
 render();
 setTimeout(()=>{const s=$('#splash');if(s)s.remove()},1700);
});

</script>
</body>
</html>
